<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon Restaurant - Menu</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- BARRE DU HAUT -->
    <header class="topbar">

        <div class="logo">
            MON RESTAURANT
        </div>

        <button class="cart-button">
            🛒 <span>0</span>
        </button>

    </header>


    <!-- PAGE D'ACCUEIL -->
    <main>

        <!-- BANNIÈRE -->
        <section class="hero">

            <div class="hero-content">

                <p class="small-title">
                    BIENVENUE
                </p>

                <h1>
                    Découvrez<br>
                    notre menu
                </h1>

                <p>
                    Des plats préparés avec passion
                </p>

                <button class="discover-button">
                    Voir le menu
                </button>

            </div>

        </section>


        <!-- RECHERCHE -->
        <section class="search-section">

            <input
                type="text"
                placeholder="🔎 Rechercher un plat..."
            >

        </section>


        <!-- CATÉGORIES -->
        <section class="menu-section">

            <div class="section-title">

                <h2>
                    Notre Menu
                </h2>

                <p>
                    Que souhaitez-vous manger ?
                </p>

            </div>


            <div class="categories">

                <button class="category-card">
                    <div class="category-icon">🍗</div>
                    <strong>Plats</strong>
                    <span>Nos spécialités</span>
                </button>


                <button class="category-card">
                    <div class="category-icon">🥤</div>
                    <strong>Boissons</strong>
                    <span>Boissons fraîches</span>
                </button>


                <button class="category-card">
                    <div class="category-icon">🍕</div>
                    <strong>Pizza</strong>
                    <span>Pizzas savoureuses</span>
                </button>


                <button class="category-card">
                    <div class="category-icon">🍝</div>
                    <strong>Spaghetti</strong>
                    <span>Nos pâtes</span>
                </button>


                <button class="category-card">
                    <div class="category-icon">🍟</div>
                    <strong>Snacks</strong>
                    <span>Petites faims</span>
                </button>


                <button class="category-card">
                    <div class="category-icon">🍰</div>
                    <strong>Desserts</strong>
                    <span>Pour terminer</span>
                </button>

            </div>

        </section>

    </main>


    <!-- BAS DE PAGE -->
    <footer>

        <h3>
            MON RESTAURANT
        </h3>

        <p>
            Votre plaisir, notre passion ❤️
        </p>

        <small>
            © 2026 - Tous droits réservés
        </small>

    </footer>


    <script src="script.js"></script>

</body>
</html>
